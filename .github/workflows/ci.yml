name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Launcher prerequisite failure safety
        shell: bash
        run: |
          set -euo pipefail
          real_go="$(command -v go)"
          go build -o "$RUNNER_TEMP/bedrock-demo-launcher" ./scripts/demo.go

          # An unsupported Go version must fail before the launcher creates or cleans its workspace.
          old_go_bin="$RUNNER_TEMP/old-go-bin"
          old_go_work="$RUNNER_TEMP/old-go-workspace"
          mkdir "$old_go_bin"
          cat > "$old_go_bin/go" <<'EOF'
          #!/bin/sh
          if [ "$1" = env ] && [ "$2" = env ]; then
            printf 'go1.21.13\n'
            exit 0
          fi
          exit 99
          EOF
          chmod +x "$old_go_bin/go"
          set +e
          PATH="$old_go_bin:$PATH" BEDROCK_DEMO_DIR="$old_go_work" "$RUNNER_TEMP/bedrock-demo-launcher" > "$RUNNER_TEMP/old-go.log" 2>&1
          old_go_exit=$?
          set -e
          test "$old_go_exit" -ne 0
          test ! -e "$old_go_work"
          grep -q 'Go 1.22+ is required; found go1.21.13' "$RUNNER_TEMP/old-go.log"

          no_git_bin="$RUNNER_TEMP/no-git-bin"
          no_git_work="$RUNNER_TEMP/no-git-workspace"
          mkdir "$no_git_bin"
          cat > "$no_git_bin/go" <<EOF
          #!/bin/sh
          exec "$real_go" "\$@"
          EOF
          chmod +x "$no_git_bin/go"
          set +e
          PATH="$no_git_bin" BEDROCK_DEMO_DIR="$no_git_work" "$RUNNER_TEMP/bedrock-demo-launcher" > "$RUNNER_TEMP/no-git.log" 2>&1
          no_git_exit=$?
          set -e
          test "$no_git_exit" -ne 0
          test ! -e "$no_git_work"
          grep -q 'Git is required and was not found on PATH' "$RUNNER_TEMP/no-git.log"
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Canonical one-step start
        shell: bash
        run: |
          set -euo pipefail
          BEDROCK_DEMO_DIR="$RUNNER_TEMP/bedrock-demo" go run ./scripts/demo.go | tee "$RUNNER_TEMP/bedrock-demo.log"
          test "$(cat "$RUNNER_TEMP/bedrock-demo/repository/result.txt")" = good
          grep -q '^status: CHECKS_PASSED$' "$RUNNER_TEMP/bedrock-demo.log"
          grep -q '^BedRock demo: READY$' "$RUNNER_TEMP/bedrock-demo.log"
          BEDROCK_DEMO_DIR="$RUNNER_TEMP/bedrock-demo" go run ./scripts/demo.go > "$RUNNER_TEMP/bedrock-demo-rerun.log"
          grep -q '^BedRock demo: READY$' "$RUNNER_TEMP/bedrock-demo-rerun.log"

          foreign="$RUNNER_TEMP/foreign-workspace"
          mkdir "$foreign"
          printf 'preserve me\n' > "$foreign/user.txt"
          set +e
          BEDROCK_DEMO_DIR="$foreign" go run ./scripts/demo.go > "$RUNNER_TEMP/foreign.log" 2>&1
          foreign_exit=$?
          set -e
          test "$foreign_exit" -ne 0
          test "$(cat "$foreign/user.txt")" = 'preserve me'
          grep -q 'refusing to reuse' "$RUNNER_TEMP/foreign.log"

          symlink_target="$RUNNER_TEMP/symlink-target"
          symlink_work="$RUNNER_TEMP/symlink-workspace"
          mkdir "$symlink_target"
          printf 'BedRock demo workspace\n' > "$symlink_target/.bedrock-demo-owned"
          printf 'preserve me\n' > "$symlink_target/user.txt"
          ln -s "$symlink_target" "$symlink_work"
          set +e
          BEDROCK_DEMO_DIR="$symlink_work" go run ./scripts/demo.go > "$RUNNER_TEMP/symlink.log" 2>&1
          symlink_exit=$?
          set -e
          test "$symlink_exit" -ne 0
          test "$(cat "$symlink_target/user.txt")" = 'preserve me'
          grep -q 'refusing to use symlink' "$RUNNER_TEMP/symlink.log"

          # A workspace beneath a symlinked ancestor must not inherit ownership
          # from or clean the physical target reached through that ancestor.
          ancestor_target="$RUNNER_TEMP/external-parent"
          ancestor_alias="$RUNNER_TEMP/aliased-parent"
          ancestor_work="$ancestor_alias/demo"
          mkdir -p "$ancestor_target/demo"
          printf 'BedRock demo workspace\n' > "$ancestor_target/demo/.bedrock-demo-owned"
          printf 'preserve me\n' > "$ancestor_target/demo/user.txt"
          ln -s "$ancestor_target" "$ancestor_alias"
          set +e
          BEDROCK_DEMO_DIR="$ancestor_work" go run ./scripts/demo.go > "$RUNNER_TEMP/ancestor-symlink.log" 2>&1
          ancestor_exit=$?
          set -e
          test "$ancestor_exit" -ne 0
          test "$(cat "$ancestor_target/demo/user.txt")" = 'preserve me'
          grep -q 'path component .* is a symlink' "$RUNNER_TEMP/ancestor-symlink.log"

          # A child of the checkout is also never disposable launcher state.
          checkout_child="$GITHUB_WORKSPACE/.bedrock-demo-test"
          set +e
          BEDROCK_DEMO_DIR="$checkout_child" go run ./scripts/demo.go > "$RUNNER_TEMP/checkout-child.log" 2>&1
          checkout_child_exit=$?
          set -e
          test "$checkout_child_exit" -ne 0
          test ! -e "$checkout_child"
          grep -q 'is inside the BedRock checkout' "$RUNNER_TEMP/checkout-child.log"

          printf 'BedRock demo workspace\n' > .bedrock-demo-owned
          trap 'rm -f .bedrock-demo-owned' EXIT
          set +e
          BEDROCK_DEMO_DIR="$GITHUB_WORKSPACE" go run ./scripts/demo.go > "$RUNNER_TEMP/checkout-workspace.log" 2>&1
          checkout_exit=$?
          set -e
          test "$checkout_exit" -ne 0
          test -f go.mod
          grep -q 'contains the BedRock checkout' "$RUNNER_TEMP/checkout-workspace.log"
          rm -f .bedrock-demo-owned
          trap - EXIT

          # Re-running after an interrupted owned launch may replace only the
          # launcher-owned bin/repository children, never unrelated user state.
          partial="$RUNNER_TEMP/partial-bedrock-demo"
          mkdir -p "$partial/bin" "$partial/repository"
          printf 'BedRock demo workspace\n' > "$partial/.bedrock-demo-owned"
          printf 'preserve me\n' > "$partial/user.txt"
          printf 'stale\n' > "$partial/bin/stale"
          printf 'stale\n' > "$partial/repository/stale"
          BEDROCK_DEMO_DIR="$partial" go run ./scripts/demo.go > "$RUNNER_TEMP/partial-recovery.log" 2>&1
          grep -q '^BedRock demo: READY$' "$RUNNER_TEMP/partial-recovery.log"
          test "$(cat "$partial/user.txt")" = 'preserve me'
          test ! -e "$partial/bin/stale"
          test ! -e "$partial/repository/stale"
          test "$(cat "$partial/repository/result.txt")" = good

          # A failure during provider execution happens after workspace ownership,
          # repository initialization, and builds. A clean rerun must recover
          # without carrying generated state forward or touching unrelated state.
          provider_failure="$RUNNER_TEMP/provider-failure-demo"
          mkdir "$provider_failure"
          printf 'BedRock demo workspace\n' > "$provider_failure/.bedrock-demo-owned"
          printf 'preserve me\n' > "$provider_failure/user.txt"
          set +e
          BEDROCK_FAKE_PROVIDER_FAIL=1 BEDROCK_DEMO_DIR="$provider_failure" go run ./scripts/demo.go > "$RUNNER_TEMP/provider-failure.log" 2>&1
          provider_failure_exit=$?
          set -e
          test "$provider_failure_exit" -ne 0
          test "$(cat "$provider_failure/user.txt")" = 'preserve me'
          test ! -e "$provider_failure/repository/result.txt"
          grep -q 'injected fake provider failure' "$RUNNER_TEMP/provider-failure.log"
          BEDROCK_DEMO_DIR="$provider_failure" go run ./scripts/demo.go > "$RUNNER_TEMP/provider-recovery.log" 2>&1
          grep -q '^status: CHECKS_PASSED$' "$RUNNER_TEMP/provider-recovery.log"
          grep -q '^BedRock demo: READY$' "$RUNNER_TEMP/provider-recovery.log"
          test "$(cat "$provider_failure/user.txt")" = 'preserve me'
          test "$(cat "$provider_failure/repository/result.txt")" = good
      - name: CLI failure rollback smoke
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bedrock" ./cmd/bedrock
          go build -o "$RUNNER_TEMP/fake-provider" ./cmd/bedrock/testdata/fakeprovider
          repo="$RUNNER_TEMP/failure-repo"
          mkdir "$repo"
          git -C "$repo" init -q
          printf 'keep me\n' > "$repo/user-work.txt"

          set +e
          "$RUNNER_TEMP/bedrock" run \
            --repo "$repo" \
            --task "write deterministic result" \
            --provider-bin "$RUNNER_TEMP/fake-provider" \
            --max-attempts 1 \
            --verify 'false' \
            > "$RUNNER_TEMP/bedrock-failure.log" 2>&1
          exit_code=$?
          set -e

          test "$exit_code" -ne 0
          test ! -e "$repo/result.txt"
          test "$(cat "$repo/user-work.txt")" = 'keep me'
          grep -q '^status: FAILED$' "$RUNNER_TEMP/bedrock-failure.log"

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Canonical one-step start on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $demo = Join-Path $env:RUNNER_TEMP 'bedrock-demo-windows'
          $env:BEDROCK_DEMO_DIR = $demo
          $log = @(go run ./scripts/demo.go 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "canonical launcher failed with exit code $LASTEXITCODE`n$($log -join "`n")" }
          $log | ForEach-Object { Write-Host $_ }
          if ((Get-Content (Join-Path $demo 'repository/result.txt') -Raw).Trim() -ne 'good') { throw 'verified result mismatch' }
          if (-not ($log -match '^status: CHECKS_PASSED$')) { throw 'missing CHECKS_PASSED status' }
          if (-not ($log -match '^BedRock demo: READY$')) { throw 'missing READY status' }

          $rerun = @(go run ./scripts/demo.go 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "canonical launcher rerun failed with exit code $LASTEXITCODE`n$($rerun -join "`n")" }
          if (-not ($rerun -match '^BedRock demo: READY$')) { throw 'rerun missing READY status' }

          $foreign = Join-Path $env:RUNNER_TEMP 'foreign-workspace-windows'
          New-Item -ItemType Directory -Path $foreign | Out-Null
          Set-Content -Path (Join-Path $foreign 'user.txt') -Value 'preserve me' -NoNewline
          $env:BEDROCK_DEMO_DIR = $foreign
          $foreignOut = Join-Path $env:RUNNER_TEMP 'foreign-workspace.stdout.log'
          $foreignErr = Join-Path $env:RUNNER_TEMP 'foreign-workspace.stderr.log'
          $process = Start-Process -FilePath 'go' -ArgumentList @('run', './scripts/demo.go') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $foreignOut -RedirectStandardError $foreignErr
          $foreignLog = @((Get-Content $foreignOut -ErrorAction SilentlyContinue), (Get-Content $foreignErr -ErrorAction SilentlyContinue))
          if ($process.ExitCode -eq 0) { throw 'launcher unexpectedly accepted foreign workspace' }
          if ((Get-Content (Join-Path $foreign 'user.txt') -Raw) -ne 'preserve me') { throw 'foreign sentinel was modified' }
          if (-not ($foreignLog -match 'refusing to reuse')) { throw "missing foreign-workspace refusal diagnostic`n$($foreignLog -join "`n")" }

          $marker = Join-Path $env:GITHUB_WORKSPACE '.bedrock-demo-owned'
          Set-Content -Path $marker -Value 'BedRock demo workspace' -NoNewline:$false
          try {
            $env:BEDROCK_DEMO_DIR = $env:GITHUB_WORKSPACE
            $checkoutOut = Join-Path $env:RUNNER_TEMP 'checkout-workspace.stdout.log'
            $checkoutErr = Join-Path $env:RUNNER_TEMP 'checkout-workspace.stderr.log'
            $checkoutProcess = Start-Process -FilePath 'go' -ArgumentList @('run', './scripts/demo.go') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $checkoutOut -RedirectStandardError $checkoutErr
            $checkoutLog = @((Get-Content $checkoutOut -ErrorAction SilentlyContinue), (Get-Content $checkoutErr -ErrorAction SilentlyContinue))
            if ($checkoutProcess.ExitCode -eq 0) { throw 'launcher unexpectedly accepted checkout as demo workspace' }
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'go.mod'))) { throw 'checkout was modified destructively' }
            if (-not ($checkoutLog -match 'contains the BedRock checkout')) { throw "missing checkout refusal diagnostic`n$($checkoutLog -join "`n")" }
          } finally {
            Remove-Item $marker -ErrorAction SilentlyContinue
          }
