name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Canonical one-step start
        run: |
          demo="$RUNNER_TEMP/bedrock-demo"
          BEDROCK_DEMO_DIR="$demo" go run ./scripts/demo.go | tee /tmp/bedrock-demo.log
          test "$(cat "$demo/repository/result.txt")" = "good"
          grep -q '^status: VERIFIED$' /tmp/bedrock-demo.log
          grep -q '^BedRock demo: READY$' /tmp/bedrock-demo.log
          BEDROCK_DEMO_DIR="$demo" go run ./scripts/demo.go >/tmp/bedrock-demo-rerun.log
          grep -q '^BedRock demo: READY$' /tmp/bedrock-demo-rerun.log
          foreign="$RUNNER_TEMP/foreign-workspace"
          mkdir -p "$foreign"
          printf 'preserve me' > "$foreign/user.txt"
          if BEDROCK_DEMO_DIR="$foreign" go run ./scripts/demo.go >/tmp/bedrock-demo-foreign.log 2>&1; then
            echo 'launcher unexpectedly accepted foreign workspace' >&2
            exit 1
          fi
          test "$(cat "$foreign/user.txt")" = "preserve me"
          grep -q 'refusing to reuse' /tmp/bedrock-demo-foreign.log
      - name: CLI failure rollback smoke
        run: |
          tmp="$(mktemp -d)"
          repo="$tmp/repository"
          home="$tmp/home"
          mkdir -p "$repo" "$home"
          git -C "$repo" init -q
          git -C "$repo" config user.email ci@example.invalid
          git -C "$repo" config user.name CI
          printf 'original\n' > "$repo/file.txt"
          git -C "$repo" add file.txt
          git -C "$repo" commit -qm initial
          cat > "$tmp/provider.sh" <<'EOF'
          #!/bin/sh
          printf '%s\n' '{"summary":"intentionally bad","files":[{"path":"file.txt","content":"bad\\n"}]}'
          EOF
          chmod +x "$tmp/provider.sh"
          cat > "$tmp/config.json" <<EOF
          {
            "provider": {"command": "$tmp/provider.sh"},
            "verification": {"commands": ["test \"\$(cat file.txt)\" = good"]},
            "repair_attempts": 0
          }
          EOF
          set +e
          HOME="$home" go run ./cmd/bedrock run --repo "$repo" --config "$tmp/config.json" --task "prove rollback" >"$tmp/stdout" 2>"$tmp/stderr"
          code=$?
          set -e
          test "$code" -ne 0
          test "$(cat "$repo/file.txt")" = "original"
          git -C "$repo" diff --quiet
          evidence="$(find "$home/.local/share/bedrock/runs" -type f -name '*.json' -print -quit)"
          test -n "$evidence"
          grep -q '"status": "FAILED"' "$evidence"
          grep -q '"rolled_back": true' "$evidence"
          grep -q '"rollback_error": ""' "$evidence"

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Canonical one-step start on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $demo = Join-Path $env:RUNNER_TEMP 'bedrock-demo-windows'
          $env:BEDROCK_DEMO_DIR = $demo
          $log = @(go run ./scripts/demo.go 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "canonical launcher failed with exit code $LASTEXITCODE`n$($log -join "`n")" }
          $log | ForEach-Object { Write-Host $_ }
          if ((Get-Content (Join-Path $demo 'repository/result.txt') -Raw).Trim() -ne 'good') { throw 'verified result mismatch' }
          if (-not ($log -match '^status: VERIFIED$')) { throw 'missing VERIFIED status' }
          if (-not ($log -match '^BedRock demo: READY$')) { throw 'missing READY status' }

          # Re-run the same canonical command to prove idempotent owned-workspace cleanup on Windows.
          $rerun = @(go run ./scripts/demo.go 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "canonical launcher rerun failed with exit code $LASTEXITCODE`n$($rerun -join "`n")" }
          if (-not ($rerun -match '^BedRock demo: READY$')) { throw 'rerun missing READY status' }

          # The ownership guard must preserve a foreign Windows workspace too. PowerShell 7.3+
          # promotes native non-zero exits to ErrorRecords when ErrorActionPreference is Stop;
          # disable that behavior only around this intentionally failing command so we can assert it.
          $foreign = Join-Path $env:RUNNER_TEMP 'foreign-workspace-windows'
          New-Item -ItemType Directory -Path $foreign | Out-Null
          Set-Content -Path (Join-Path $foreign 'user.txt') -Value 'preserve me' -NoNewline
          $env:BEDROCK_DEMO_DIR = $foreign
          $oldNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $foreignLog = @(go run ./scripts/demo.go 2>&1)
            $foreignExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativePreference
          }
          if ($foreignExit -eq 0) { throw 'launcher unexpectedly accepted foreign workspace' }
          if ((Get-Content (Join-Path $foreign 'user.txt') -Raw) -ne 'preserve me') { throw 'foreign sentinel was modified' }
          if (-not ($foreignLog -match 'refusing to reuse')) { throw "missing foreign-workspace refusal diagnostic`n$($foreignLog -join "`n")" }
