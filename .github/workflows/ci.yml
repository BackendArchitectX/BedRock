name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Canonical one-step start
        shell: bash
        run: |
          set -euo pipefail
          BEDROCK_DEMO_DIR="$RUNNER_TEMP/bedrock-demo" go run ./scripts/demo.go | tee "$RUNNER_TEMP/bedrock-demo.log"
          test "$(cat "$RUNNER_TEMP/bedrock-demo/repository/result.txt")" = good
          grep -q '^status: VERIFIED$' "$RUNNER_TEMP/bedrock-demo.log"
          grep -q '^BedRock demo: READY$' "$RUNNER_TEMP/bedrock-demo.log"
          # Rerun the exact canonical launcher to prove ordinary stale demo state is replaced safely.
          BEDROCK_DEMO_DIR="$RUNNER_TEMP/bedrock-demo" go run ./scripts/demo.go > "$RUNNER_TEMP/bedrock-demo-rerun.log"
          grep -q '^BedRock demo: READY$' "$RUNNER_TEMP/bedrock-demo-rerun.log"

          # A caller-selected existing directory must never be recursively cleaned
          # unless a previous BedRock demo run explicitly marked it as owned.
          foreign="$RUNNER_TEMP/foreign-workspace"
          mkdir "$foreign"
          printf 'preserve me\n' > "$foreign/user.txt"
          set +e
          BEDROCK_DEMO_DIR="$foreign" go run ./scripts/demo.go > "$RUNNER_TEMP/foreign.log" 2>&1
          foreign_exit=$?
          set -e
          test "$foreign_exit" -ne 0
          test "$(cat "$foreign/user.txt")" = 'preserve me'
          grep -q 'refusing to reuse' "$RUNNER_TEMP/foreign.log"
      - name: CLI failure rollback smoke
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bedrock" ./cmd/bedrock
          go build -o "$RUNNER_TEMP/fake-provider" ./cmd/bedrock/testdata/fakeprovider
          repo="$RUNNER_TEMP/failure-repo"
          mkdir "$repo"
          git -C "$repo" init -q
          printf 'keep me\n' > "$repo/user-work.txt"

          set +e
          "$RUNNER_TEMP/bedrock" run \
            --repo "$repo" \
            --task "write deterministic result" \
            --provider-bin "$RUNNER_TEMP/fake-provider" \
            --max-attempts 1 \
            --verify 'false' \
            > "$RUNNER_TEMP/bedrock-failure.log" 2>&1
          exit_code=$?
          set -e

          test "$exit_code" -ne 0
          test ! -e "$repo/result.txt"
          test "$(cat "$repo/user-work.txt")" = 'keep me'
          grep -q '^status: FAILED$' "$RUNNER_TEMP/bedrock-failure.log"

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Canonical one-step start on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $demo = Join-Path $env:RUNNER_TEMP 'bedrock-demo-windows'
          $env:BEDROCK_DEMO_DIR = $demo
          $log = @(go run ./scripts/demo.go 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "canonical launcher failed with exit code $LASTEXITCODE`n$($log -join "`n")" }
          $log | ForEach-Object { Write-Host $_ }
          if ((Get-Content (Join-Path $demo 'repository/result.txt') -Raw).Trim() -ne 'good') { throw 'verified result mismatch' }
          if (-not ($log -match '^status: VERIFIED$')) { throw 'missing VERIFIED status' }
          if (-not ($log -match '^BedRock demo: READY$')) { throw 'missing READY status' }

          # Re-run the same canonical command to prove idempotent owned-workspace cleanup on Windows.
          $rerun = @(go run ./scripts/demo.go 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "canonical launcher rerun failed with exit code $LASTEXITCODE`n$($rerun -join "`n")" }
          if (-not ($rerun -match '^BedRock demo: READY$')) { throw 'rerun missing READY status' }

          # The ownership guard must preserve a foreign Windows workspace too.
          $foreign = Join-Path $env:RUNNER_TEMP 'foreign-workspace-windows'
          New-Item -ItemType Directory -Path $foreign | Out-Null
          Set-Content -Path (Join-Path $foreign 'user.txt') -Value 'preserve me' -NoNewline
          $env:BEDROCK_DEMO_DIR = $foreign
          $oldNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $foreignLog = @(go run ./scripts/demo.go 2>&1)
            $foreignExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativePreference
          }
          if ($foreignExit -eq 0) { throw 'launcher unexpectedly accepted foreign workspace' }
          if ((Get-Content (Join-Path $foreign 'user.txt') -Raw) -ne 'preserve me') { throw 'foreign sentinel was modified' }
          if (-not ($foreignLog -match 'refusing to reuse')) { throw "missing foreign-workspace refusal diagnostic`n$($foreignLog -join "`n")" }
