name: Demo path safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  symlinked-ancestor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Reject workspace beneath symlinked ancestor without mutation
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/external-parent"
          alias="$RUNNER_TEMP/aliased-parent"
          work="$alias/demo"
          mkdir -p "$target/demo"
          printf 'BedRock demo workspace\n' > "$target/demo/.bedrock-demo-owned"
          printf 'preserve me\n' > "$target/demo/user.txt"
          ln -s "$target" "$alias"

          set +e
          BEDROCK_DEMO_DIR="$work" go run ./scripts/demo.go > "$RUNNER_TEMP/ancestor-symlink.log" 2>&1
          exit_code=$?
          set -e

          test "$exit_code" -ne 0
          test "$(cat "$target/demo/user.txt")" = 'preserve me'
          grep -q 'path component .* is a symlink' "$RUNNER_TEMP/ancestor-symlink.log"

      - name: Reject workspace inside checkout without mutation
        shell: bash
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/.bedrock-demo-test"
          trap 'rm -rf "$work"' EXIT

          set +e
          BEDROCK_DEMO_DIR="$work" go run ./scripts/demo.go > "$RUNNER_TEMP/checkout-workspace.log" 2>&1
          exit_code=$?
          set -e

          test "$exit_code" -ne 0
          test ! -e "$work"
          grep -q 'is inside the BedRock checkout' "$RUNNER_TEMP/checkout-workspace.log"

      - name: Recover an interrupted owned workspace without deleting unrelated state
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/partial-bedrock-demo"
          mkdir -p "$work/bin" "$work/repository"
          printf 'BedRock demo workspace\n' > "$work/.bedrock-demo-owned"
          printf 'preserve me\n' > "$work/user.txt"
          printf 'stale\n' > "$work/bin/stale"
          printf 'stale\n' > "$work/repository/stale"

          BEDROCK_DEMO_DIR="$work" go run ./scripts/demo.go > "$RUNNER_TEMP/partial-recovery.log" 2>&1

          grep -q 'BedRock demo: READY' "$RUNNER_TEMP/partial-recovery.log"
          test "$(cat "$work/user.txt")" = 'preserve me'
          test ! -e "$work/bin/stale"
          test ! -e "$work/repository/stale"
          test "$(cat "$work/repository/result.txt")" = 'good'
